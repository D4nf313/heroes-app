<div class="container">
  <h1>Bienvenido,</h1>
  <p>Aqui puedes ver todos los personajes de la serie Rick and Morty</p>
  @if (listOfData() && listOfData().length > 0) {
  <div class="table-operations">
    <button nz-button (click)="sortByName()">Sort by Name</button>
  </div>

  <nz-table
    #filterTable
    [nzData]="listOfData()"
    nzTableLayout="fixed"
    [nzPageSize]="10"
    [nzTotal]="total()"
    (nzPageIndexChange)="onPageIndexChange($event)"
  >
    <thead>
      <tr>
        <th
          [(nzSortOrder)]="column.sortOrder"
          [nzSortFn]="column.sortFn"
          *ngFor="let column of listOfColumns()"
        >
          {{ column.name }}
        </th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let character of filterTable.data">
        <td>{{ character.name }}</td>
        <td>{{ character.species }}</td>
        <td>{{ character.gender }}</td>
        <td>{{ character.status }}</td>
        <td>
          <button nz-button nzType="primary" (click)="goToDetail(character.id)">
            Ver Detalle
          </button>
        </td>
      </tr>
    </tbody> </nz-table
  >} @else {
  <div class="empty-state">
    <nz-empty nzNotFoundContent="No hay datos disponibles"></nz-empty>
  </div>
  }
</div>
